<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <link rel="canonical" href="https://mariyabatan.com/" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="0; url=https://mariyabatan.com/" />
    <script>
      // carry query string and hash (HashRouter routes like #/portfolio) to the new domain
      var dest = "https://mariyabatan.com/" + (location.search || "") + (location.hash || "");
      location.replace(dest);
    </script>
  </head>
  <body>
    This site has moved to <a href="https://mariyabatan.com/">mariyabatan.com</a>. Redirecting…
  </body>
</html>
